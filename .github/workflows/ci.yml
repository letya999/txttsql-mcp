name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - run: python3 .repo-safety/scripts/forbid_sensitive_files.py --all
      - run: cargo +1.96.0 fmt --all -- --check
      - run: cargo +1.96.0 check --locked
      - run: cargo +1.96.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.96.0 test --locked

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t txttsql-mcp:ci .
      - run: python3 tests/docker_memory_smoke.py
      - run: docker build -f Dockerfile.plugins --build-arg BASE_IMAGE=txttsql-mcp:ci -t txttsql-mcp:plugins .
      - run: python3 tests/docker_plugins_smoke.py
