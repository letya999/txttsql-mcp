[package]
name = "txttsql-mcp"
version = "0.1.0"
edition = "2024"
description = "Read-only analytics MCP server for PostgreSQL, CockroachDB and ClickHouse with installable database and metadata plugins"
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/letya999/txttsql-mcp"
homepage = "https://github.com/letya999/txttsql-mcp"
keywords = ["mcp", "postgres", "clickhouse", "analytics", "metadata"]
categories = ["database", "command-line-utilities"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.4", features = ["transport-io"] }
rusqlite = { version = "0.32", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.55", features = ["visitor"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
